version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: wms-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wms_db
      MYSQL_USER: wms_user
      MYSQL_PASSWORD: wms_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  app:
    build: .
    container_name: wms-backend-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql://wms_user:wms_password@db:3306/wms_db
    depends_on:
      - db

volumes:
  mariadb_data: