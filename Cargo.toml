[package]
name = "wms-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Framework Web
actix-web = "4.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Banco de dados
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql"] }

# Adicionado para serialização JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"